name: Setup Node and pnpm
description: Install the repository Node.js and pnpm toolchain, then optionally install dependencies.

inputs:
  install:
    description: Run pnpm install with the frozen lockfile.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Keep this in sync with mise.toml; the CLI workspace declares the exact
        # Node 24.14.0 engine, so a floating 24.x emits engine warnings.
        node-version: "24.14.0"
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          apps/zcode-cli/pnpm-lock.yaml

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      env:
        HUSKY: "0"
      run: pnpm install --frozen-lockfile
